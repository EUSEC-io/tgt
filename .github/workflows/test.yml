name: test

on:
  pull_request:
  push:
    branches: [master, 'web-*']

jobs:
  fishtape:
    name: fish + fishtape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fishtape
        run: |
          fish -c 'curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher'
          fish -c 'fisher install jorgebucaran/fishtape'

      - name: Install plugin (symlinks)
        run: make dev

      - name: Run fishtape suite
        run: make test

  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install web package + pytest
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        working-directory: web
        run: pytest -q

  js-syntax:
    name: js syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships node. `node --check` parses each file
      # without executing — catches paren/brace mismatches and stray
      # commas that browsers only surface as a silent "blank page" at
      # load time. Cheap insurance; the whole static/ dir is small
      # enough that this finishes in under a second.
      - name: Check JavaScript syntax
        run: |
          for f in web/tgt_web/static/*.js; do
            echo "→ $f"
            node --check "$f"
          done

  drift:
    name: drift contract (fish ↔ web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web package + pytest
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run drift contract test
        working-directory: web
        run: pytest -q tests/test_drift.py

  browser:
    # Headless chromium load of `/`, asserting zero console errors
    # / warnings and zero uncaught page errors. The static `node
    # --check` job catches parser-level breakage; this job is the
    # only thing that catches runtime-only regressions like the
    # module-load-order bug that shipped in #14. ~30 s end to end
    # with the cached chromium binary.
    name: browser smoke (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web package + pytest + playwright
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest playwright

      # Cache the chromium binary (~150 MB) so we don't re-download
      # it on every PR. Key by playwright version so a Playwright
      # bump auto-invalidates and re-fetches.
      - name: Detect Playwright version
        id: pw
        run: |
          # The `playwright` package doesn't expose __version__ on the
          # module; ask importlib.metadata instead.
          v=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (when cache misses)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      # apt-installed system libs (libnss, libnspr, etc.) aren't
      # cached by actions/cache, so always run install-deps. It's
      # an apt step — fast when packages are already present.
      - name: Install Chromium system deps
        run: python -m playwright install-deps chromium

      - name: Run browser smoke
        working-directory: web
        run: pytest -v tests/test_browser.py
