name: test

on:
  pull_request:
  push:
    branches: [master, 'web-*']

jobs:
  fishtape:
    name: fish + fishtape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Install fishtape
        run: |
          fish -c 'curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher'
          fish -c 'fisher install jorgebucaran/fishtape'

      - name: Install plugin (symlinks)
        run: make dev

      - name: Run fishtape suite
        run: make test

  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install web package + pytest
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        working-directory: web
        run: pytest -q

  drift:
    name: drift contract (fish ↔ web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web package + pytest
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run drift contract test
        working-directory: web
        run: pytest -q tests/test_drift.py
