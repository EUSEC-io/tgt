<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgt</title>
<script>
  // Set the theme before the stylesheet is applied so we never flash
  // the wrong palette. Saved preference wins; default is dark
  // (pentest terminals are dark, the OS preference doesn't really
  // reflect user intent for this UI). The toggle button still
  // flips + persists.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('tgt-theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved || 'dark');
  })();
</script>
<link rel="stylesheet" href="/style.css">
<!-- Order matters: our app module must execute BEFORE Alpine, so
     forms.js's `document.addEventListener('alpine:init', …)` is
     attached before Alpine calls `Alpine.start()` (which Alpine 3
     does at the end of its own script execution, not on
     DOMContentLoaded). If Alpine ran first, our factory
     registrations would be silently lost and every `x-data="…"`
     in the document would `not defined`. -->
<script type="module" src="/app.js"></script>
<script defer src="/vendor/alpine-3.14.1.min.js"></script>
</head>
<body>

<header>
  <button id="sidebar-toggle" class="sidebar-toggle" type="button"
          aria-label="toggle sidebar">☰</button>
  <h1>tgt</h1>
  <div class="header-mid" id="active-info"></div>
  <div class="header-right">
    <label><input type="checkbox" id="show-archived"> show archived</label>
    <button id="theme-toggle" class="theme-toggle" type="button"
            title="toggle light / dark" aria-label="toggle theme">🌗</button>
    <button id="refresh-btn" class="refresh" type="button">↻ refresh</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="layout">
  <aside x-data="scenarioNewForm()">
    <div class="filter-row">
      <input id="filter" placeholder="filter scenarios…" autocomplete="off">
      <button class="add" type="button" @click="open = true"
              title="new scenario" aria-label="new scenario">+ new</button>
    </div>
    <div class="form-card sidebar-form" x-show="open" x-cloak>
      <div class="form-title">new scenario</div>
      <div class="form-error" x-show="error" x-text="error"></div>
      <form @submit.prevent="submit">
        <label>
          <span class="form-label">name</span>
          <input x-model.trim="name" required autocomplete="off"
                 placeholder="e.g. lab">
        </label>
        <div class="form-buttons">
          <button type="button" @click="cancel()">cancel</button>
          <button type="submit" class="primary" :disabled="submitting"
                  x-text="submitting ? 'creating…' : 'create'"></button>
        </div>
      </form>
    </div>
    <ul id="scenario-list"></ul>
  </aside>
  <main>
    <div id="entity-search-bar" hidden>
      <input id="entity-search" type="search" autocomplete="off"
             placeholder="search targets / creds / DCs…">
      <span id="entity-search-count" class="search-count"></span>
    </div>
    <div id="detail"><div class="placeholder">Select a scenario from the list.</div></div>
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="action-panel" class="action-panel" hidden></div>

<!-- Reusable confirm modal. Driven by Alpine.store('confirm'); any
     destructive action goes through `confirmThen(title, message, fn)`
     in app.js. The modal is always present in the DOM; visibility
     follows the store. -->
<div class="modal-backdrop"
     x-data
     x-show="$store.confirm.open"
     x-cloak
     @keydown.escape.window="$store.confirm.cancel()">
  <div class="modal" @click.outside="$store.confirm.cancel()">
    <div class="modal-title" x-text="$store.confirm.title"></div>
    <div class="modal-message" x-text="$store.confirm.message"></div>
    <pre class="modal-preview"
         x-show="$store.confirm.preview"
         x-text="$store.confirm.preview"></pre>
    <div class="modal-buttons">
      <button type="button" @click="$store.confirm.cancel()">cancel</button>
      <button type="button" class="primary danger"
              @click="$store.confirm.accept()"
              x-text="$store.confirm.confirmLabel"></button>
    </div>
  </div>
</div>

</body>
</html>
