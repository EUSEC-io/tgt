    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="80" class="foreground">tgt --show</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="264" class="foreground">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text></g><g id="g4"><text x="0" textLength="232" class="foreground">  TGT           = 10.10.10.10</text></g><g id="g5"><text x="0" textLength="168" class="foreground">  TGT_PORT      = 445</text></g><g id="g6"><text x="0" textLength="184" class="foreground">  TGT_USERNAME  = admin</text></g><g id="g7"><text x="0" textLength="208" class="foreground">  TGT_PASSWORD  = ********</text></g><g id="g8"><text x="0" textLength="232" class="foreground">  TGT_AD_DOMAIN = dante.local</text></g><g id="g9"><text x="0" textLength="272" class="foreground">  TGT_DC        = DC01.dante.local</text></g><g id="g10"><text x="0" textLength="272" class="foreground">  TGT_HOSTS     = dc01.dante.local</text></g><g id="g11"><text x="0" textLength="104" class="foreground">  /etc/hosts:</text></g><g id="g12"><text x="0" textLength="256" class="foreground">    10.10.10.10 dc01.dante.local</text></g><g id="g13"><text x="0" textLength="136" class="foreground">  /etc/krb5.conf:</text></g><g id="g14"><text x="0" textLength="128" class="foreground">    (no entries)</text></g><g id="g15"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="96" class="foreground">tgt --revoke</text></g><g id="g16"><text x="0" textLength="296" class="foreground">&#10003; Removed 10.10.10.10 from /etc/hosts</text></g><g id="g17"><text x="0" textLength="88" class="foreground">&#10003; TGT unset</text></g><g id="g18"><text x="0" textLength="128" class="foreground">&#10003; TGT_PORT unset</text></g><g id="g19"><text x="0" textLength="160" class="foreground">&#10003; TGT_USERNAME unset</text></g><g id="g20"><text x="0" textLength="160" class="foreground">&#10003; TGT_PASSWORD unset</text></g><g id="g21"><text x="0" textLength="168" class="foreground">&#10003; TGT_AD_DOMAIN unset</text></g><g id="g22"><text x="0" textLength="112" class="foreground">&#10003; TGT_DC unset</text></g><g id="g23"><text x="0" textLength="136" class="foreground">&#10003; TGT_HOSTS unset</text></g><g id="g24"><text x="0" textLength="424" class="foreground">&#10003; TGT_ACTIVE unset (target deselected; scenario kept)</text></g><g id="g25"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="416" class="foreground">tgt --show    # state cleared; scenario still active</text></g><g id="g26"><text x="0" textLength="216" class="foreground">  TGT           = (not set)</text></g><g id="g27"><text x="0" textLength="216" class="foreground">  TGT_PORT      = (not set)</text></g><g id="g28"><text x="0" textLength="216" class="foreground">  TGT_USERNAME  = (not set)</text></g><g id="g29"><text x="0" textLength="216" class="foreground">  TGT_PASSWORD  = (not set)</text></g><g id="g30"><text x="0" textLength="216" class="foreground">  TGT_AD_DOMAIN = (not set)</text></g><g id="g31"><text x="0" textLength="216" class="foreground">  TGT_DC        = (not set)</text></g><g id="g32"><text x="0" textLength="216" class="foreground">  TGT_HOSTS     = (not set)</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="442"/><use xlink:href="#g3" y="476"/><use xlink:href="#g4" y="493"/><use xlink:href="#g5" y="510"/><use xlink:href="#g6" y="527"/><rect x="0" y="544" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="544"/></g><g><use xlink:href="#g1" y="884"/><use xlin