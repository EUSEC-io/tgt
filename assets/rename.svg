<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 640 427" width="640" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="80" rows="25"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }
    
            :root {
                --animation-duration: 15019ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
6.678%{transform:translateY(-442px)}
33.324%{transform:translateY(-884px)}
40.049%{transform:translateY(-1326px)}
60.031%{transform:translateY(-1768px)}
66.709%{transform:translateY(-2210px)}
100.000%{transform:translateY(-2210px)}
            }

            #screen_view {
                animation-duration: 15019ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
            /* The colors defined below are the default 16 colors used for rendering text of the terminal. Adjust
               them as needed.
               PowerShell colors based on https://en.wikipedia.org/wiki/ANSI_escape_code#Colors */
            .foreground {fill: #cccccc;}
            .background {fill: #0c0c0c;}
            .color0 {fill: #0c0c0c;}
            .color1 {fill: #c50f1f;}
            .color2 {fill: #13a10e;}
            .color3 {fill: #c19c00;}
            .color4 {fill: #0037da;}
            .color5 {fill: #881798;}
            .color6 {fill: #3a96dd;}
            .color7 {fill: #cccccc;}
            .color8 {fill: #767676;}
            .color9 {fill: #e74856;}
            .color10 {fill: #16c60c;}
            .color11 {fill: #f9f1a5;}
            .color12 {fill: #3b78ff;}
            .color13 {fill: #b4009e;}
            .color14 {fill: #61d6d6;}
            .color15 {fill: #f2f2f2;}
        </style>
    </defs>
    <svg id="screen" width="640" height="425" viewBox="0 0 640 425" preserveAspectRatio="xMidYMin slice">
    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="112" class="foreground">cat /etc/hosts</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="152" class="foreground">127.0.0.1 localhost</text></g><g id="g4"><text x="0" textLength="536" class="foreground">10.10.10.5 web01.dante.local intranet.dante.local # tgt:dante:web01</text></g><g id="g5"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="176" class="foreground">tgt rename web01 web02</text></g><g id="g6"><text x="0" textLength="272" class="color2">&#10003; renamed target 'web01' &#8594; 'web02'</text></g><g id="g7"><text x="0" textLength="56" class="color6">smp86$ </text><text x="56" textLength="448" class="foreground">cat /etc/hosts    # tag rewritten; manual line untouched</text></g><g id="g8"><text x="0" textLength="536" class="foreground">10.10.10.5 web01.dante.local intranet.dante.local # tgt:dante:web02</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="442"/><use xlink:href="#g3" y="459"/><use xlink:href="#g4" y="476"/><rect x="0" y="493" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="493"/></g><g><use xlink:href="#g1" y="884"/><use xlink:href="#g3" y="901"/><use xlink:href="#g4" y="918"/><use xlink:href="#g5" y="935"/><rect x="0" y="952" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="952"/></g><g><use xlink:href="#g1" y="1326"/><use xlink:href="#g3" y="1343"/><use xlink:href="#g4" y="1360"/><use xlink:href="#g5" y="1377"/><use xlink:href="#g6" y="1394"/><rect x="0" y="1411" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1411"/></g><g><use xlink:href="#g1" y="1768"/><use xlink:href="#g3" y="1785"/><use xlink:href="#g4" y="1802"/><use xlink:href="#g5" y="1819"/><use xlink:href="#g6" y="1836"/><use xlink:href="#g7" y="1853"/><rect x="0" y="1870" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1870"/></g><g><use xlink:href="#g1" y="2210"/><use xlink:href="#g3" y="2227"/><use xlink:href="#g4" y="2244"/><use xlink:href="#g5" y="2261"/><use xlink:href="#g6" y="2278"/><use xlink:href="#g7" y="2295"/><use xlink:href="#g3" y="2312"/><use xlink:href="#g8" y="2329"/><rect x="0" y="2346" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2346"/></g></g></svg>
